services:
  mongo:
    image: mongo:7
    container_name: career-ai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ai-career-backend-master
    container_name: ai-career-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ai-career
      - JWT_SEC=${JWT_SEC}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - API_KEY_GEMINI=${API_KEY_GEMINI}
      - Razorpay_Key=${Razorpay_Key}
      - Razorpay_Secret=${Razorpay_Secret}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./ai-career-frontend-master
      args:
        VITE_SERVER_URL: "${VITE_SERVER_URL:-http://localhost:5000}"
    container_name: ai-career-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
